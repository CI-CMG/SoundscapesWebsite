website: 
  page-navigation: true
  title: "NOAA quarto simple" 
  site-url: https://www.soundscapemonitoring.us
  repo-url: "https://github.com/CI-CMG/SoundscapesWebsite"
  repo-actions: [source, issue]
  favicon: images/onms-logo-no-text-800.png
  
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#AABFC1"
    logo: images/onms-logo-no-text-800.png
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://sanctuaries.noaa.gov/
        text: "Office of National Marine Sanctuaries"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - text: <b>General</b>
      - href: content/index.qmd
        text: Home
      - href: https://sanctuaries.noaa.gov/science/monitoring/sound/
        target: _blank
        text: ONMS Sound Project Page
      - href: https://pmc.ncbi.nlm.nih.gov/articles/PMC12702305/
        target: _blank
        text: NOAA Noise Reference Station Network
      - text: <br>
      - text: <b>Eastern Region</b>
      - href: content/sb.qmd
        text: Stellwagen Bank
      - href: content/fgb.qmd
        text: Flower Garden Banks
      - href: content/gr.qmd
        text: Gray's Reef
      - href: content/fk.qmd
        text: Florida Keys
      - text: <br>
      - text: <b>West Coast Region</b>
      - href: content/oc.qmd
        text: Olympic Coast
      - href: content/cb.qmd
        text: Greater Farallones and Cordell Bank 
      - href: content/mb.qmd
        text: Monterey Bay
      - href: content/ch.qmd
        text: Chumash Heritage
      - href: content/ci.qmd
        text: Channel Islands
      - text: <br>
      - text: <b>Pacific Islands Region</b>
      - href: content/pm.qmd
        text: Papahānaumokuākea
      - href: content/as.qmd
        text: American Samoa
      - href: content/hi.qmd
        text: Hawaiian Islands Humpback Whale

format:
  html:
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    page-layout: full


filters:
  - include-files.lua
  - quarto
  
  