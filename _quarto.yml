project: 
  type: website
  resources:
    - CNAME
  render:
    - content/index.qmd
    - content/sb.qmd
    - content/fgb.qmd
    - content/gr.qmd
    - content/fk.qmd
    - content/oc.qmd
    - content/cb.qmd
    - content/mb.qmd
    - content/ch.qmd
    - content/ci.qmd
    - content/pm.qmd
